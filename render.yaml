databases:
  - name: compendium-db
    plan: free
    databaseName: compendium
    user: compendium

services:
  - type: web
    name: compendium
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compendium-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
